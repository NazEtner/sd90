[package]
name = "sd90-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"

# ASIO ドライバは in-proc COM サーバなので DLL で吐く。
# rlib も出しておいて、プローブ binary から同じコードを使う。
[lib]
name = "sd90_asio"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "sd90-rs"
path = "src/main.rs"


[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Devices_Usb",
    "Win32_Media_Audio",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_Security",
]
